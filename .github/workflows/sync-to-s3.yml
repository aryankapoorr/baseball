name: Sync composure assets to S3

on:
  push:
    branches: [main]
    paths:
      - 'composure/composure.ipynb'
      - 'composure/results/composure_scores_*.csv'

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Upload notebook
        run: |
          aws s3 cp composure/composure.ipynb \
            s3://outside-baseball-composure/notebooks/composure.ipynb \
            --cache-control "public, max-age=300"

      - name: Upload CSVs
        run: |
          aws s3 cp composure/results/ s3://outside-baseball-composure/data/ \
            --recursive \
            --exclude "*" \
            --include "composure_scores_*.csv" \
            --cache-control "public, max-age=300"

      - name: Update seasons manifest
        run: |
          seasons=$(ls composure/results/composure_scores_*.csv \
            | grep -oE '[0-9]{4}' | sort -n \
            | python3 -c "import sys,json; print(json.dumps([int(l) for l in sys.stdin]))")
          echo "{\"seasons\":$seasons}" | aws s3 cp - \
            s3://outside-baseball-composure/seasons.json \
            --content-type "application/json" \
            --cache-control "public, max-age=300"
