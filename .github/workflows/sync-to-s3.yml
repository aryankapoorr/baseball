name: Sync project assets to S3

on:
  push:
    branches: [main]
    paths:
      - 'projects.json'
      - '**/*.ipynb'
      - '**/results/*.csv'

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Sync all projects
        run: |
          python3 - <<'EOF'
          import json, subprocess, os, glob

          with open("projects.json") as f:
            projects = json.load(f)

          for p in projects:
            slug        = p["slug"]
            bucket      = p["bucket"]
            notebook    = p["notebook"]
            data_dir    = p["dataDir"]
            data_pattern = p["dataPattern"]

            print(f"\n── {slug} → s3://{bucket}")

            # Upload notebook
            subprocess.run([
              "aws", "s3", "cp", notebook,
              f"s3://{bucket}/notebooks/{os.path.basename(notebook)}",
              "--cache-control", "public, max-age=300"
            ], check=True)

            # Upload CSVs
            subprocess.run([
              "aws", "s3", "cp", data_dir, f"s3://{bucket}/data/",
              "--recursive",
              "--exclude", "*",
              "--include", data_pattern,
              "--cache-control", "public, max-age=300"
            ], check=True)

            # Regenerate seasons.json from available CSVs
            csv_files = sorted(glob.glob(os.path.join(data_dir, data_pattern)))
            seasons = sorted(set(
              int(s) for f in csv_files
              for s in [os.path.basename(f).replace(".csv", "").split("_")[-1]]
              if s.isdigit()
            ))
            seasons_json = json.dumps({"seasons": seasons})
            proc = subprocess.run(
              ["aws", "s3", "cp", "-",
               f"s3://{bucket}/seasons.json",
               "--content-type", "application/json",
               "--cache-control", "public, max-age=300"],
              input=seasons_json.encode(),
              check=True
            )
            print(f"   seasons: {seasons}")

          print("\nDone.")
          EOF
